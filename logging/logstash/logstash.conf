input {
  # ── Application logs via TCP ─────────────────────────────────
  tcp {
    port => 5044
    codec => json_lines
    tags => ["application"]
  }

  # ── Docker container logs via Beats ─────────────────────────
  beats {
    port => 5045
  }

  # ── Syslog ───────────────────────────────────────────────────
  syslog {
    port => 5514
    tags => ["syslog"]
  }
}

filter {
  # ── Parse JSON logs ──────────────────────────────────────────
  if [message] =~ /^\{/ {
    json {
      source => "message"
    }
  }

  # ── Add timestamp ─────────────────────────────────────────────
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # ── Enrich with environment info ──────────────────────────────
  mutate {
    add_field => {
      "environment" => "production"
      "project"     => "ai-ecommerce-devops"
    }
  }

  # ── Classify log level ────────────────────────────────────────
  if [level] =~ /ERROR|error/ {
    mutate { add_tag => ["error"] }
  } else if [level] =~ /WARN|warn/ {
    mutate { add_tag => ["warning"] }
  }
}

output {
  # ── Send to Elasticsearch ─────────────────────────────────────
  elasticsearch {
    hosts    => ["elasticsearch:9200"]
    index    => "ecommerce-logs-%{+YYYY.MM.dd}"
    template_overwrite => false
  }

  # ── Debug output (disable in production) ──────────────────────
  # stdout { codec => rubydebug }
}
