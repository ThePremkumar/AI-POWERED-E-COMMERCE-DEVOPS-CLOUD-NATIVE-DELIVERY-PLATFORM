---
# =============================================================================
# site.yml – Master Ansible playbook
# AI-Powered E-Commerce DevOps & Cloud-Native Delivery Platform
# =============================================================================

- name: Configure Application Servers
  hosts: app_servers
  become: true
  gather_facts: true

  vars_files:
    - vars/main.yml

  roles:
    - common
    - docker
    - app_user
    - app_deploy
    - monitoring_agent

- name: Configure Database Servers
  hosts: db_servers
  become: true

  vars_files:
    - vars/main.yml

  roles:
    - common
    - database
