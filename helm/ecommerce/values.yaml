# =============================================================================
# values.yaml – Helm default values
# AI-Powered E-Commerce DevOps & Cloud-Native Delivery Platform
# =============================================================================

replicaCount: 3

image:
  repository: docker.io/thepremkumar/ecommerce-app
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - dockerhub-secret

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: nginx
  host: ecommerce.example.com   # ← override per environment

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  NODE_ENV: production
  PORT: "3000"
  LOG_LEVEL: info

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

namespace: ecommerce
