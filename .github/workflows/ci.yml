name: CI – Basic Build & Test

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint, Test & Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix app/

      - name: Run linter
        run: npm run lint --prefix app/ || true

      - name: Run unit tests
        run: npm test --prefix app/ -- --ci --coverage || true

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high --prefix app/ || true

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: ecommerce-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container image scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ecommerce-app:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          severity: "HIGH,CRITICAL"
        continue-on-error: true
