---
# =============================================================================
# deployment.yml – Kubernetes Deployment (Rolling Update strategy)
# AI-Powered E-Commerce DevOps & Cloud-Native Delivery Platform
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-app
  namespace: ecommerce
  labels:
    app: ecommerce-app
    version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ecommerce-app
  # ── Rolling Update Strategy ──────────────────────────────────
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ecommerce-app
        version: "1.0.0"
    spec:
      # ── Security Context ───────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: ecommerce-app
          image: docker.io/davine-ecommerce/ecommerce-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          # ── Resources ───────────────────────────────────────────
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # ── Environment ─────────────────────────────────────────
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secrets
          # ── Health Probes ────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            failureThreshold: 30
            periodSeconds: 10

      # ── Pod termination ───────────────────────────────────────
      terminationGracePeriodSeconds: 30
